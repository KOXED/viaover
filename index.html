<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIAOVER</title>
  <script>
    if (sessionStorage.getItem("viaoverEntered")) {
      document.documentElement.classList.add("entered");
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Remove #construction when the site is ready. -->
  <div id="construction">
    <div class="construction-copy">
      <p>VIAOVER</p>
      <p>UNDER CONSTRUCTION</p>
      <p>This website is currently in development.</p>
      <p>Some pages, features, and links may be incomplete, unavailable, or change without notice.</p>
      <p>You are welcome to look around while VIAOVER is being built.</p>
      <button type="button" id="enter">[ ENTER VIAOVER ]</button>
    </div>
  </div>

  <h1>VIAOVER</h1>

  <div class="minigames">
    <section id="slots" aria-label="Slot machine">
      <h2>SLOTS</h2>
      <p id="slot-balance">Coins: 10</p>
      <div class="reels">
        <div class="reel" id="reel-0" aria-hidden="true"><span class="symbol">🍒</span></div>
        <div class="reel" id="reel-1" aria-hidden="true"><span class="symbol">🍋</span></div>
        <div class="reel" id="reel-2" aria-hidden="true"><span class="symbol">🔔</span></div>
      </div>
      <p id="slot-result" aria-live="polite">Match three symbols to win.</p>
      <div class="slot-actions">
        <button type="button" id="spin">[ SPIN ]</button>
        <button type="button" id="reset-coins">[ RESET ]</button>
      </div>
    </section>

    <section id="cat" aria-label="Pet the cat">
      <div class="cat-stage">
        <button type="button" id="cat-face" class="cat-face" aria-labelledby="cat-label">🐱</button>
      </div>
      <p id="cat-label" class="cat-label">Pet the cat</p>
      <p id="cat-message" aria-live="polite"></p>
    </section>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
