<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VIAOVER — Games</title>
  <script>
    try {
      if (localStorage.getItem("viaoverTheme") === "night") {
        document.documentElement.classList.add("night-mode");
      }
    } catch (e) {}
    if (sessionStorage.getItem("viaoverEntered")) {
      document.documentElement.classList.add("entered");
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
  <button type="button" id="theme-toggle" aria-pressed="false">
    <span class="theme-label-light">☀️ Light View</span>
    <span class="theme-label-night">🌙 Night View</span>
  </button>

  <!-- Remove #construction when the site is ready. -->
  <div id="construction">
    <div class="construction-copy">
      <p>VIAOVER</p>
      <p>UNDER CONSTRUCTION</p>
      <p>This website is currently in development.</p>
      <p>Some pages, features, and links may be incomplete, unavailable, or change without notice.</p>
      <p>You are welcome to look around while VIAOVER is being built.</p>
      <button type="button" id="enter">[ ENTER VIAOVER ]</button>
    </div>
  </div>

  <aside id="guest-wallet" class="guest-wallet" aria-label="Guest account">
    <p class="guest-wallet-label">Guest</p>
    <p id="guest-id"></p>
    <p id="guest-coins">Coins: 0</p>
    <p id="guest-points">Points: 0</p>
  </aside>

  <header class="site-header">
    <a class="site-logo" href="/">VIAOVER</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/" aria-current="page">Games</a>
    </nav>
  </header>

  <main class="portal">
    <h1>Games</h1>
    <div id="game-list" class="game-list"></div>
  </main>

  <script src="/js/economy.js"></script>
  <script src="/js/games.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
